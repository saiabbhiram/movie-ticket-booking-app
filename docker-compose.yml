services:
  mysql:
    image: mysql:8.0
    container_name: cinebook-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-movie_booking_db}
      MYSQL_USER: ${MYSQL_USER:-cinebook_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-cinebook_pass123}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - cinebook_mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword123}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - cinebook-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cinebook-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: ${NODE_ENV:-production}
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-cinebook_user}
      DB_PASSWORD: ${DB_PASSWORD:-cinebook_pass123}
      DB_NAME: ${DB_NAME:-movie_booking_db}
      DB_SSL: ${DB_SSL:-false}
      JWT_SECRET: ${JWT_SECRET:-cinebook_super_secret_jwt_key_change_in_prod}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - cinebook-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: cinebook-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - cinebook-network

volumes:
  cinebook_mysql_data:

networks:
  cinebook-network:
    driver: bridge
